document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"width: 54px; height: 54px; border-radius: 14px; background: linear-gradient(160deg, oklch(0.66 0.11 42), oklch(0.52 0.11 42)); box-shadow: inset 0 4px 0 rgba(255,255,255,0.28);\"><\u002Fdiv>\n    <div style=\"width: 54px; height: 54px; border-radius: 14px; background: linear-gradient(160deg, oklch(0.78 0.10 78), oklch(0.64 0.10 78)); box-shadow: inset 0 4px 0 rgba(255,255,255,0.30);\"><\u002Fdiv>\n    <div style=\"width: 54px; height: 54px; border-radius: 14px; background: linear-gradient(160deg, oklch(0.64 0.07 150), oklch(0.50 0.07 150)); box-shadow: inset 0 4px 0 rgba(255,255,255,0.26);\"><\u002Fdiv>\n    <div style=\"width: 54px; height: 54px; border-radius: 14px; background: linear-gradient(160deg, oklch(0.60 0.09 250), oklch(0.46 0.09 250)); box-shadow: inset 0 4px 0 rgba(255,255,255,0.26);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <h1 style=\"margin: 0; font-family: 'Bitter', serif; font-size: 108px; font-weight: 600; line-height: 1.04; letter-spacing: -2px; max-width: 1400px;\">Understanding Your Medicare Options<\u002Fh1>\n  <p style=\"margin: 40px 0 0; font-size: var(--t-sub); line-height: 1.4; color: oklch(0.86 0.02 85); max-width: 1250px;\">A clear, simple guide to Medicare Parts A–D, coverage, costs, and enrollment for 2026.<\u002Fp>\n  <div style=\"margin-top: 90px; padding-top: 34px; border-top: 2px solid oklch(0.42 0.03 250); display: flex; gap: 56px; align-items: baseline; font-size: var(--t-small); color: oklch(0.84 0.02 85);\">\n    <span style=\"font-weight: 600; color: oklch(0.97 0.01 85);\">Thomas Crowhurst, Licensed Insurance Broker<\u002Fspan>\n    <span>317-728-9417<\u002Fspan>\n    <span>thomas@crowhurstinsurance.com<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Eligibility\" data-screen-label=\"02\" data-speaker-notes=\"Most people here qualify on age. Eligibility is federal and does not depend on income.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">Who Qualifies<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Are You Eligible for Medicare?<\u002Fh2>\n  <div style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; flex: 1;\">\n    <div style=\"background: oklch(0.94 0.04 30); border-radius: 24px; padding: 46px 44px; display: flex; flex-direction: column; justify-content: center; gap: 24px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 104px; font-weight: 700; color: var(--clay); line-height: 1;\">65+<\u002Fspan>\n      <span style=\"font-size: 48px; font-weight: 700; line-height: 1.15;\">Age 65 or older<\u002Fspan>\n      <span style=\"font-size: 34px; line-height: 1.35; color: var(--ink-soft);\">Eligibility begins the month you turn 65.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 250); border-radius: 24px; padding: 46px 44px; display: flex; flex-direction: column; justify-content: center; gap: 24px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 104px; font-weight: 700; color: var(--blue); line-height: 1;\">24<\u002Fspan>\n      <span style=\"font-size: 48px; font-weight: 700; line-height: 1.15;\">Under 65 &amp; disabled<\u002Fspan>\n      <span style=\"font-size: 34px; line-height: 1.35; color: var(--ink-soft);\">After 24 months of SSDI, or immediately with ALS or ESRD.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 152); border-radius: 24px; padding: 46px 44px; display: flex; flex-direction: column; justify-content: center; gap: 24px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 104px; font-weight: 700; color: var(--sage); line-height: 1;\">5<\u002Fspan>\n      <span style=\"font-size: 48px; font-weight: 700; line-height: 1.15;\">Citizen or legal resident<\u002Fspan>\n      <span style=\"font-size: 34px; line-height: 1.35; color: var(--ink-soft);\">Legal residents qualify after 5 consecutive years in the U.S.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"What Is Medicare (blocks)\" data-screen-label=\"03\" data-speaker-notes=\"The blocks metaphor: five separate pieces, and you choose how they fit together. Nobody uses all five at once.\" style=\"padding: 76px var(--pad-x) 66px; background: linear-gradient(180deg, oklch(0.955 0.018 82) 0%, oklch(0.91 0.026 78) 100%); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 60px;\">\n    <div>\n      <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">The Building Blocks<\u002Fspan>\n      <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">What Is Medicare?<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: var(--t-body); line-height: 1.4; color: var(--ink-soft); max-width: 720px;\">A federal health insurance program run by the Centers for Medicare &amp; Medicaid Services (CMS). It comes in five pieces.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"margin-top: 46px; flex: 1; display: grid; grid-template-columns: repeat(5, 330px); justify-content: center; align-content: center; gap: 40px;\">\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 22px;\">\n      <div style=\"width: 330px; height: 330px; border-radius: 38px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.68 0.11 42) 0%, oklch(0.56 0.11 42) 58%, oklch(0.47 0.10 40) 100%); box-sh  0 rgba(255,255,255,0.26), inset 0 -14px 22px rgba(0,0,0,0.16), 0 20px 30px rgba(90,60,30,0.20); display: flex; align-items: center; justify-content: center;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 168px; font-weight: 700; color: rgba(255,255,255,0.94); text-shadow: 0 3px 0 rgba(0,0,0,0.18);\">C<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size: 46px; font-weight: 700; text-align: center;\">Part C<\u002Fspan>\n      <span style=\"font-size: 30px; line-height: 1.3; text-align: center; color: var(--ink-soft);\">Medicare Advantage<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 22px;\">\n      <div style=\"width: 330px; height: 330px; border-radius: 38px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.79 0.10 78) 0%, oklch(0.68 0.10 78) 58%, oklch(0.58 0.09 76) 100%); box-shadow: inset 0 8px 0 rgba(255,255,255,0.34), inset 0 -14px 22px rgba(0,0,0,0.14), 0 20px 30px rgba(90,60,30,0.20); display: flex; align-items: center; justify-content: center;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 168px; font-weight: 700; color: rgba(255,255,255,0.95); text-shadow: 0 3px 0 rgba(0,0,0,0.16);\">D<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size: 46px; font-weight: 700; text-align: center;\">Part D<\u002Fspan>\n      <span style=\"font-size: 30px; line-height: 1.3; text-align: center; color: var(--ink-soft);\">Prescription Drug Coverage<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 22px;\">\n      <div style=\"width: 330px; height: 330px; border-radius: 38px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.58 0.085 350) 0%, oklch(0.48 0.085 350) 58%, oklch(0.40 0.075 350) 100%); box-shadow: inset 0 8px 0 rgba(255,255,255,0.26), inset 0 -14px 22px rgba(0,0,0,0.16), 0 20px 30px rgba(90,60,30,0.20); display: flex; align-items: center; justify-content: center;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 168px; font-weight: 700; color: rgba(255,255,255,0.94); text-shadow: 0 3px 0 rgba(0,0,0,0.18);\">M<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size: 46px; font-weight: 700; text-align: center;\">Medigap<\u002Fspan>\n      <span style=\"font-size: 30px; line-height: 1.3; text-align: center; color: var(--ink-soft);\">Medicare Supplement<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Original Medicare\" data-screen-label=\"04\" data-speaker-notes=\"Parts A and B together are Original Medicare. Flag the missing out-of-pocket limit now; it sets up slides 7 through 9.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">The Foundation<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Original Medicare: Parts A &amp; B<\u002Fh2>\n  <div style=\"margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 34px; flex: 1;\">\n    <div style=\"display: flex; flex-direction: column; background: oklch(0.945 0.035 30); border-radius: 26px; overflow: hidden; box-shadow: 0 16px 30px rgba(90,50,40,0.10);\">\n      <div style=\"background: var(--clay); padding: 26px 36px; display: flex; align-items: center; gap: 22px;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 68px; font-weight: 700; line-height: 1; color: oklch(0.98 0.01 40);\">A<\u002Fspan>\n        <span style=\"font-size: 32px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: oklch(0.98 0.01 40);\">Hospital Insurance<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: 1; padding: 34px 40px; display: flex; flex-direction: column; justify-content: center; gap: 22px;\">\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Hospitalization<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Skilled nursing facility care<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Hospice care<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Home health care<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; background: oklch(0.945 0.03 250); border-radius: 26px; overflow: hidden; box-shadow: 0 16px 30px rgba(40,60,100,0.12);\">\n      <div style=\"background: var(--blue); padding: 26px 36px; display: flex; align-items: center; gap: 22px;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 68px; font-weight: 700; line-height: 1; color: oklch(0.98 0.01 250);\">B<\u002Fspan>\n        <span style=\"font-size: 32px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: oklch(0.98 0.01 250);\">Medical Insurance<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: 1; padding: 34px 40px; display: flex; flex-direction: column; justify-content: center; gap: 22px;\">\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Doctor visits<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Outpatient care<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Preventive services<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Occupational and physical therapy<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top: 32px; background: var(--ink); border-radius: 20px; padding: 30px 44px; display: flex; align-items: center; gap: 28px;\">\n    <span style=\"font-family: 'Bitter', serif; font-size: 46px; font-weight: 700; color: oklch(0.85 0.14 78);\">No cap<\u002Fspan>\n    <span style=\"font-size: var(--t-sub); font-weight: 600; color: oklch(0.97 0.01 85);\">Original Medicare has no annual out-of-pocket limit.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"A vs B Coverage\" data-screen-label=\"05\" data-speaker-notes=\"Admitted as an inpatient, both parts are working: Part A pays for the room, Part B pays for the doctor. Not admitted means Part B.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">Coverage Detail<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Part A vs. Part B — What's Covered<\u002Fh2>\n  <p style=\"margin: 22px 0 0; font-size: var(--t-sub); font-weight: 600;\">Admitted to the hospital? Both parts are working.<\u002Fp>\n  <div style=\"margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; flex: 1;\">\n    <div style=\"background: oklch(0.94 0.035 30); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column;\">\n      <div style=\"background: var(--clay); padding: 22px 36px; display: flex; align-items: baseline; gap: 18px;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 46px; font-weight: 700; color: oklch(0.98 0.01 40);\">Part A<\u002Fspan>\n        <span style=\"font-size: 32px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: oklch(0.94 0.03 40);\">pays for the room<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: 1; padding: 30px 38px; display: flex; flex-direction: column; justify-content: center; gap: 20px;\">\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Bed, board, and meals<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Nursing and hospital staff<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Operating and recovery room, ICU<\u002Fspan>\n        <span style=\"font-size: var(--t-small); color: var(--ink-soft);\">Not the doctor, surgeon, or anesthesiologist.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 250); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column;\">\n      <div style=\"background: var(--blue); padding: 22px 36px; display: flex; align-items: baseline; gap: 18px;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 46px; font-weight: 700; color: oklch(0.98 0.01 250);\">Part B<\u002Fspan>\n        <span style=\"font-size: 32px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: oklch(0.92 0.03 250);\">pays for the doctor<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: 1; padding: 30px 38px; display: flex; flex-direction: column; justify-content: center; gap: 20px;\">\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Doctors who visit your room<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Surgeon and specialist services<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">Procedures performed while admitted<\u002Fspan>\n        <span style=\"font-size: var(--t-small); color: var(--ink-soft);\">Doctor fees, anywhere you are treated.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top: 28px; background: var(--ink); border-radius: 20px; padding: 26px 40px; display: flex; align-items: center; gap: 26px;\">\n    <span style=\"font-size: var(--t-small); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: oklch(0.85 0.14 78);\">Not admitted<\u002Fspan>\n    <span style=\"font-size: var(--t-body); color: oklch(0.96 0.01 85);\">ER visits, observation, outpatient surgery, labs and X-rays are all Part B.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cost Vocabulary\" data-screen-label=\"06\" data-speaker-notes=\"Define the four words with a dollar figure attached to each. Ask which one they have run into.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">Vocabulary<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Types of Medicare Costs<\u002Fh2>\n  <div style=\"margin-top: 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; flex: 1;\">\n    <div style=\"display: flex; flex-direction: column; background: oklch(0.945 0.035 30); border-radius: 24px; overflow: hidden;\">\n      <div style=\"background: var(--clay); padding: 18px 34px;\"><span style=\"font-size: 30px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: oklch(0.98 0.01 40);\">Premium<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; padding: 26px 34px; display: flex; flex-direction: column; justify-content: center; gap: 14px;\">\n        <span style=\"font-size: var(--t-body); line-height: 1.35;\">The monthly amount you pay to keep coverage in force.<\u002Fspan>\n        <span style=\"font-size: var(--t-small); line-height: 1.35; color: var(--ink-soft);\">Example: like a phone bill, $202.90 a month for Part B, whether or not you see a doctor.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; background: oklch(0.945 0.03 250); border-radius: 24px; overflow: hidden;\">\n      <div style=\"background: var(--blue); padding: 18px 34px;\"><span style=\"font-size: 30px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: oklch(0.98 0.01 250);\">Deductible<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; padding: 26px 34px; display: flex; flex-direction: column; justify-content: center; gap: 14px;\">\n        <span style=\"font-size: var(--t-body); line-height: 1.35;\">What you pay yourself before Medicare starts paying.<\u002Fspan>\n        <span style=\"font-size: var(--t-small); line-height: 1.35; color: var(--ink-soft);\">Example: your first $283 of Part B care in 2026 comes out of your pocket.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; background: oklch(0.945 0.03 152); border-radius: 24px; overflow: hidden;\">\n      <div style=\"background: var(--sage); padding: 18px 34px;\"><span style=\"font-size: 30px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: oklch(0.98 0.01 152);\">Copay<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; padding: 26px 34px; display: flex; flex-direction: column; justify-content: center; gap: 14px;\">\n        <span style=\"font-size: var(--t-body); line-height: 1.35;\">A flat dollar amount for a specific visit or service.<\u002Fspan>\n        <span style=\"font-size: var(--t-small); line-height: 1.35; color: var(--ink-soft);\">Example: a set $40 every time you see a specialist, no matter the bill.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; background: oklch(0.945 0.035 348); border-radius: 24px; overflow: hidden;\">\n      <div style=\"background: var(--plum); padding: 18px 34px;\"><span style=\"font-size: 30px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: oklch(0.98 0.01 348);\">Coinsurance<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; padding: 26px 34px; display: flex; flex-direction: column; justify-content: center; gap: 14px;\">\n        <span style=\"font-size: var(--t-body); line-height: 1.35;\">A percentage you share with Medicare — an 80/20 split.<\u002Fspan>\n        <span style=\"font-size: var(--t-small); line-height: 1.35; color: var(--ink-soft);\">Example: on a $5,000 MRI, Medicare pays $4,000 and you pay $1,000.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Part A Costs 2026\" data-screen-label=\"07\" data-speaker-notes=\"Walk the day ladder, then the 75-day example. The point is the absence of a ceiling.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 50px;\">\n    <div>\n      <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">2026 Figures<\u002Fspan>\n      <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Medicare Part A (Hospital) Costs<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 152); border-radius: 999px; padding: 16px 36px; display: flex; align-items: baseline; gap: 14px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 44px; font-weight: 700; color: var(--sage);\">$0<\u002Fspan>\n      <span style=\"font-size: var(--t-small); font-weight: 600; color: var(--ink-soft);\">premium for most people<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top: 34px; flex: 1.15; display: flex; align-items: stretch; gap: 26px;\">\n    <div style=\"background: var(--clay); border-radius: 22px; padding: 34px 38px; justify-content: center; display: flex; flex-direction: column; gap: 6px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 62px; font-weig =\"background: var(--panel); border-radius: 16px; padding: 26px 26px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;\">\n        <span style=\"font-size: var(--t-small); font-weight: 600;\">Days 1–20<\u002Fspan>\n        <span style=\"font-family: 'Bitter', serif; font-size: 34px; font-weight: 700; color: var(--sage);\">$0<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: var(--panel); border-radius: 16px; padding: 26px 26px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;\">\n        <span style=\"font-size: var(--t-small); font-weight: 600;\">Days 21–100<\u002Fspan>\n        <span style=\"font-family: 'Bitter', serif; font-size: 34px; font-weight: 700; color: oklch(0.52 0.12 70);\">$217.00<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: var(--panel); border-radius: 16px; padding: 26px 26px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;\">\n        <span style=\"font-size: var(--t-small); font-weight: 600;\">Day 101+<\u002Fspan>\n        <span style=\"font-family: 'Bitter', serif; font-size: 34px; font-weight: 700; color: var(--clay);\">Full cost<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top: 26px; background: var(--ink); border-radius: 24px; padding: 32px 44px; display: flex; align-items: center; justify-content: space-between; gap: 40px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <span style=\"font-size: var(--t-small); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: oklch(0.85 0.14 78);\">A 75-day hospital stay<\u002Fspan>\n      <span style=\"font-size: var(--t-body); color: oklch(0.93 0.01 85);\">$1,736 deductible + $434/day × 15 days (days 61–75)<\u002Fspan>\n      <span style=\"font-size: var(--t-small); color: oklch(0.80 0.02 85);\">Original Medicare has no annual out-of-pocket limit.<\u002Fspan>\n    <\u002Fdiv>\n    <span
