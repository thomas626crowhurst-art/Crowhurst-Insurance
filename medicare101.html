rid-template-columns: 0.75fr 1.25fr; gap: 30px; align-items: center;\">\n      <span style=\"font-size: var(--t-body); font-weight: 700; color: var(--clay);\">Still working at 65<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">Confirm with HR whether your employer coverage is creditable before delaying.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: auto 0 0; padding-top: 26px; font-size: var(--t-legal); line-height: 1.35; color: var(--ink-soft);\">We do not offer every plan available in your area. Any information we provide is limited to those plans we do offer in your area. Please contact Medicare.gov or 1-800-MEDICARE to get information on all of your options. For accommodations of persons with special needs at meetings, call 1-800-MEDICARE (TTY: 711). Not affiliated with or endorsed by the U.S. government or the federal Medicare program.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Late Penalties\" data-screen-label=\"11\" data-speaker-notes=\"Emphasize permanence. This is the strongest argument for enrolling on time.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--clay);\">Timing Matters<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Late Enrollment Penalties — For Life<\u002Fh2>\n  <div style=\"margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; flex: 1;\">\n    <div style=\"background: var(--blue); border-radius: 26px; padding: 36px 40px; display: flex; flex-direction: column; gap: 18px; color: oklch(0.98 0.01 250);\">\n      <span style=\"font-size: var(--t-small); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: oklch(0.88 0.04 250);\">Part B penalty<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">10% added to your premium for every 12 months you were eligible but not enrolled.<\u002Fspan>\n      <div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 6px;\">\n        <span style=\"font-size: var(--t-small); color: oklch(0.88 0.04 250);\">Wait two years — 10% × $202.90 × 2<\u002Fspan>\n        <span style=\"font-family: 'Bitter', serif; font-size: 88px; font-weight: 700; line-height: 1;\">+$40.58<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">per month, for life<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: var(--clay); border-radius: 26px; padding: 36px 40px; display: flex; flex-direction: column; gap: 18px; color: oklch(0.98 0.01 40);\">\n      <span style=\"font-size: var(--t-small); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: oklch(0.90 0.04 40);\">Part D penalty<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">1% of the national base premium ($38.99 in 2026) for each month you went without Part D.<\u002Fspan>\n      <div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 6px;\">\n        <span style=\"font-size: var(--t-small); color: oklch(0.90 0.04 40);\">Each uncovered month<\u002Fspan>\n        <span style=\"font-family: 'Bitter', serif; font-size: 88px; font-weight: 700; line-height: 1;\">+$0.39<\u002Fspan>\n        <span style=\"font-size: var(--t-body); font-weight: 600;\">per month, permanently<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 28px 0 0; font-size: var(--t-sub); font-weight: 700;\">These are not one-time fees. They follow you for life.<\u002Fp>\n  <p style=\"margin: 22px 0 0; font-size: var(--t-legal); line-height: 1.35; color: var(--ink-soft);\">We do not offer every plan available in your area. Any information we provide is limited to those plans we do offer in your area. Please contact Medicare.gov or 1-800-MEDICARE to get information on all of your options. For accommodations of persons with special needs at meetings, call 1-800-MEDICARE (TTY: 711). Not affiliated with or endorsed by the U.S. government or the federal Medicare program.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Your Options (blocks)\" data-screen-label=\"12\" data-speaker-notes=\"Back to the blocks. Three ways people stack them — everything after this slide is detail on these three paths.\" style=\"padding: 64px var(--pad-x) 56px; background: linear-gradient(180deg, oklch(0.955 0.018 82) 0%, oklch(0.91 0.026 78) 100%); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 60px;\">\n    <div>\n      <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">Three Paths<\u002Fspan>\n      <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Your Medicare Options<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: var(--t-body); line-height: 1.35; color: var(--ink-soft); max-width: 640px;\">The same pieces, stacked a few different ways. Most people choose one of these three.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"margin-top: 30px; flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; align-items: end; justify-items: center;\">\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 26px;\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px;\">\n        <div style=\"width: 360px; height: 150px; border-radius: 30px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.79 0.13 78) 0%, oklch(0.68 0.13 76) 60%, oklch(0.58 0.12 74) 100%); box-shadow: inset 0 8px 0 rgba(255,255,255,0.28), inset 0 -14px 20px rgba(0,0,0,0.16), 0 18px 28px rgba(90,60,30,0.20); display: flex; align-items: center; justify-content: center; gap: 20px;\">\n          <span style=\"font-family: 'Bitter', serif; font-size: 86px; font-weight: 700; line-height: 1; color: rgba(255,255,255,0.95);\">D<\u002Fspan>\n          <span style=\"font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.9);\">Part D<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width: 440px; height: 160px; border-radius: 32px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.58 0.12 348) 0%, oklch(0.48 0.12 348) 60%, oklch(0.40 0.10 348) 100%); box-shadow: inset 0 8px 0 rgba(255,255,255,0.28), inset 0 -14px 20px rgba(0,0,0,0.16), 0 18px 28px rgba(90,60,30,0.20); display: flex; align-items: center; justify-content: center; gap: 20px;\">\n          <span style=\"font-family: 'Bitter', serif; font-size: 86px; font-weight: 700; line-height: 1; color: rgba(255,255,255,0.95);\">M<\u002Fspan>\n          <span style=\"font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.9);\">Medigap<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width: 520px; height: 178px; border-radius: 34px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.66 0.10 140) 0%, oklch(0.54 0.10 140) 60%, oklch(0.45 0.09 140) 100%); box-shadow: inset 0 8px 0 rgba(255,255,255,0.28), inset 0 -14px 20px rgba(0,0,0,0.16), 0 18px 28px rgba(90,60,30,0.20); display: flex; align-items: center; justify-content: center; gap: 20px;\">\n          <span style=\"font-family: 'Bitter', serif; font-size: 86px; font-weight: 700; line-height: 1; color: rgba(255,255,255,0.95);\">A+B<\u002Fspan>\n          <span style=\"font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.9);\">Original Medicare<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size: 34px; font-weight: 700; text-align: center; line-height: 1.3; min-height: 92px; text-wrap: balance;\">1. Original Medicare + Medigap + Part D<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 26px;\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px;\">\n        <div style=\"width: 360px; height: 150px; border-radius: 30px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.79 0.13 78) 0%, oklch(0.68 0.13 76) 60%, oklch(0.58 0.12 74) 100%); box-shadow: inset 0 8px 0 rgba(255,255,255,0.28), inset 0 -14px 20px rgba(0,0,0,0.16), 0 18px 28px rgba(90,60,30,0.20); display: flex; align-items: center; justify-content: center; gap: 20px;\">\n          <span style=\"font-family: 'Bitter', serif; font-size: 86px; font-weight: 700; line-height: 1; color: rgba(255,255,255,0.95);\">D<\u002Fspan>\n          <span style=\"font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.9);\">Part D<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width: 520px; height: 178px; border-radius: 34px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.66 0.10 140) 0%, oklch(0.54 0.10 140) 60%, oklch(0.45 0.09 140) 100%); box-shadow: inset 0 8px 0 rgba(255,255,255,0.28), inset 0 -14px 20px rgba(0,0,0,0.16), 0 18px 28px rgba(90,60,30,0.20); display: flex; align-items: center; justify-content: center; gap: 20px;\">\n          <span style=\"font-family: 'Bitter', serif; font-size: 86px; font-weight: 700; line-height: 1; color: rgba(255,255,255,0.95);\">A+B<\u002Fspan>\n          <span style=\"font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.9);\">Original Medicare<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size: 34px; font-weight: 700; text-align: center; line-height: 1.3; min-height: 92px; text-wrap: balance;\">2. Original Medicare + Part D, no supplement<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 26px;\">\n      <div style=\"width: 520px; height: 502px; border-radius: 40px; background: repeating-linear-gradient(97deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 9px), linear-gradient(160deg, oklch(0.63 0.09 152) 0%, oklch(0.52 0.09 152) 58%, oklch(0.44 0.08 152) 100%); box-shadow: inset 0 8px 0 rgba(255,255,255,0.28), inset 0 -14px 20px rgba(0,0,0,0.16), 0 18px 28px rgba(90,60,30,0.20); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 190px; font-weight: 700; line-height: 1; color: rgba(255,255,255,0.95);\">C<\u002Fspan>\n        <span style=\"font-size: 34px; font-weight: 600; color: rgba(255,255,255,0.92); text-align: center; line-height: 1.3;\">A + B, often D,<br>in one plan<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size: 34px; font-weight: 700; text-align: center; line-height: 1.3; min-height: 92px; text-wrap: balance;\">3. Medicare Advantage (Part C)<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Medicare Advantage\" data-screen-label=\"13\" data-speaker-notes=\"Networks are the tradeoff for the out-of-pocket maximum. Ask whether their doctors matter more than the premium.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--sage);\">Part C<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Medicare Advantage Plans<\u002Fh2>\n  <div style=\"margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px;\">\n    <div style=\"background: oklch(0.945 0.03 152); border-radius: 18px; padding: 22px 32px;\"><span style=\"font-size: var(--t-body); font-weight: 600;\">Private insurers, approved by Medicare<\u002Fspan><\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 152); border-radius: 18px; padding: 22px 32px;\"><span style=\"font-size: var(--t-body); font-weight: 600;\">Combines Parts A and B; many include Part D<\u002Fspan><\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 152); border-radius: 18px; padding: 22px 32px;\"><span style=\"font-size: var(--t-body); font-weight: 600;\">Includes an annual out-of-pocket maximum<\u002Fspan><\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 152); border-radius: 18px; padding: 22px 32px;\"><span style=\"font-size: var(--t-body); font-weight: 600;\">You must have both Part A and Part B to enroll<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <span style=\"margin-top: 30px; font-size: var(--t-small); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft);\">Three plan types<\u002Fspan>\n  <div style=\"margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; flex: 1;\">\n    <div style=\"background: var(--sage); border-radius: 24px; padding: 30px 34px; display: flex; flex-direction: column; gap: 16px; color: oklch(0.98 0.01 152);\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 58px; font-weight: 700; line-height: 1;\">HMO<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">Stay in network. Referrals needed for specialists.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: var(--blue); border-radius: 24px; padding: 30px 34px; display: flex; flex-direction: column; gap: 16px; color: oklch(0.98 0.01 250);\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 58px; font-weight: 700; line-height: 1;\">PPO<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">More flexible. Out-of-network care costs more.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: var(--plum); border-radius: 24px; padding: 30px 34px; display: flex; flex-direction: column; gap: 16px; color: oklch(0.98 0.01 348);\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 58px; font-weight: 700; line-height: 1;\">HMO-POS<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">An HMO with a limited out-of-network option.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 24px 0 0; font-size: var(--t-legal); line-height: 1.35; color: var(--ink-soft);\">We do not offer every plan available in your area. Any information we provide is limited to those plans we do offer in your area. Please contact Medicare.gov or 1-800-MEDICARE to get information on all of your options. For accommodations of persons with special needs at meetings, call 1-800-MEDICARE (TTY: 711). Not affiliated with or endorsed by the U.S. government or the federal Medicare program.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Advantage vs Supplement\" data-screen-label=\"14\" data-speaker-notes=\"Neither column is the right answer for everyone. Frame it as flexibility versus predictability.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">Side by Side<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Medicare Advantage vs. Medicare Supplement<\u002Fh2>\n  <div style=\"margin-top: 30px; display: grid; grid-template-columns: 0.8fr 1fr 1fr; gap: 26px; flex: 1;\">\n    <div style=\"display: flex; flex-direction: column;\">\n      <div style=\"height: 96px;\"><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; border-bottom: 2px solid var(--rule);\"><span style=\"font-family: 'Bitter', serif; font-size: 38px; font-weight: 600;\">Doctor networks<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; border-bottom: 2px solid var(--rule);\"><span style=\"font-family: 'Bitter', serif; font-size: 38px; font-weight: 600;\">Annual costs<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; border-bottom: 2px solid var(--rule);\"><span style=\"font-family: 'Bitter', serif; font-size: 38px; font-weight: 600;\">Max out-of-pocket<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center;\"><span style=\"font-family: 'Bitter', serif; font-size: 38px; font-weight: 600;\">Plan stability<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; background: oklch(0.945 0.03 152); border-radius: 26px; overflow: hidden; box-shadow: 0 16px 30px rgba(40,80,60,0.10);\">\n      <div style=\"height: 96px; background: var(--sage); display: flex; align-items: center; justify-content: center; padding: 0 24px;\">\n        <span style=\"font-size: 30px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: oklch(0.98 0.01 152); text-align: center;\">Medicare Advantage<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 30px; border-bottom: 2px solid oklch(0.88 0.03 152);\"><span style=\"font-size: var(--t-body); font-weight: 600; text-align: center;\">Network required<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 30px; border-bottom: 2px solid oklch(0.88 0.03 152);\"><span style=\"font-size: var(--t-body); font-weight: 600; text-align: center;\">Variable<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 30px; border-bottom: 2px solid oklch(0.88 0.03 152);\"><span style=\"font-size: var(--t-body); font-weight: 600; text-align: center; line-height: 1.25;\">Up to $9,250 in network (2026 CMS maximum)<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 30px;\"><span style=\"font-size: var(--t-body); font-weight: 600; text-align: center;\">Can change annually<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; background: oklch(0.945 0.035 348); border-radius: 26px; overflow: hidden; box-shadow: 0 16px 30px rgba(80,40,70,0.10);\">\n      <div style=\"height: 96px; background: var(--plum); display: flex; align-items: center; justify-content: center; padding: 0 24px;\">\n        <span style=\"font-size: 30px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: oklch(0.98 0.01 348); text-align: center;\">Medicare Supplement<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 30px; border-bottom: 2px solid oklch(0.88 0.035 348);\"><span style=\"font-size: var(--t-body); font-weight: 600; text-align: center; line-height: 1.25;\">Any doctor accepting Medicare<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 30px; border-bottom: 2px solid oklch(0.88 0.035 348);\"><span style=\"font-size: var(--t-body); font-weight: 600; text-align: center;\">Predictable<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 30px; border-bottom: 2px solid oklch(0.88 0.035 348);\"><span style=\"font-size: var(--t-body); font-weight: 600; text-align: center; line-height: 1.25;\">Minimal — $283 Part B deductible plus plan costs<\u002Fspan><\u002Fdiv>\n      <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 30px;\"><span style=\"font-size: var(--t-body); font-weight: 600; text-align: center;\">Guaranteed renewable<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 24px 0 0; font-size: var(--t-legal); line-height: 1.35; color: var(--ink-soft);\">We do not offer every plan available in your area. Any information we provide is limited to those plans we do offer in your area. Please contact Medicare.gov or 1-800-MEDICARE to get information on all of your options. For accommodations of persons with special needs at meetings, call 1-800-MEDICARE (TTY: 711). Not affiliated with or endorsed by the U.S. government or the federal Medicare program.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Part D\" data-screen-label=\"15\" data-speaker-notes=\"Formularies differ by plan. Tell them to bring their prescription list to any review.\" style=\"padding: var(--pad-top) var(--pad-x) var(--pad-bottom); background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">Part D<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Medicare Prescription Drug Coverage<\u002Fh2>\n  <div style=\"margin-top: 40px; display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 72px; flex: 1;\">\n    <div style=\"display: flex; flex-direction: column; gap: 26px;\">\n      <span style=\"font-size: var(--t-body); line-height: 1.45;\">Helps pay for prescription drug costs.<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.45;\">Sold by private insurers, standalone or bundled into a Medicare Advantage plan.<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.45;\">Every plan has its own formulary — the list of drugs it covers.<\u002Fspan>\n    <\u002Fdiv>\n    <div>\n      <span style=\"font-size: var(--t-small); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft);\">A tiered formulary<\u002Fspan>\n      <div style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"background: oklch(0.94 0.03 140); border-radius: 14px; padding: 20px 28px; display: flex; justify-content: space-between; align-items: baseline; gap: 24px;\">\n          <span style=\"font-size: var(--t-body);\">Tier 1 — Preferred generic<\u002Fspan>\n          <span style=\"font-family: 'Bitter', serif; font-size: 30px; font-weight: 700; color: var(--sage);\">$<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.945 0.026 110); border-radius: 14px; padding: 20px 28px; display: flex; justify-content: space-between; align-items: baseline; gap: 24px;\">\n          <span style=\"font-size: var(--t-body);\">Tier 2 — Generic<\u002Fspan>\n          <span style=\"font-family: 'Bitter', serif; font-size: 30px; font-weight: 700; color: oklch(0.55 0.09 110);\">$$<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.945 0.03 85); border-radius: 14px; padding: 20px 28px; display: flex; justify-content: space-between; align-items: baseline; gap: 24px;\">\n          <span style=\"font-size: var(--t-body);\">Tier 3 — Preferred brand<\u002Fspan>\n          <span style=\"font-family: 'Bitter', serif; font-size: 30px; font-weight: 700; color: oklch(0.58 0.10 78);\">$$$<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.94 0.028 55); border-radius: 14px; padding: 20px 28px; display: flex; justify-content: space-between; align-items: baseline; gap: 24px;\">\n          <span style=\"font-size: var(--t-body);\">Tier 4 — Non-preferred brand<\u002Fspan>\n          <span style=\"font-family: 'Bitter', serif; font-size: 30px; font-weight: 700; color: oklch(0.56 0.11 50);\">$$$$<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.935 0.03 40); border-radius: 14px; padding: 20px 28px; display: flex; justify-content: space-between; align-items: baseline; gap: 24px;\">\n          <span style=\"font-size: var(--t-body);\">Tier 5 — Specialty drugs<\u002Fspan>\n          <span style=\"font-family: 'Bitter', serif; font-size: 30px; font-weight: 700; color: var(--clay);\">$$$$$<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Drug Payment Stages\" data-screen-label=\"16\" data-speaker-notes=\"Three stages, resetting each January. The catastrophic threshold is the new headline for 2026.\" style=\"padding: var(--pad-top) var(--pad-x) var(--pad-bottom); background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">Part D Mechanics<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Prescription Drug Payment Stages<\u002Fh2>\n  <p style=\"margin: 20px 0 0; font-size: var(--t-body); color: var(--ink-soft);\">The stages reset every January.<\u002Fp>\n  <div style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; flex: 1;\">\n    <div style=\"background: var(--panel); border-radius: 22px; padding: 40px 38px; display: flex; flex-direction: column; gap: 18px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 56px; font-weight: 600; line-height: 1; color: var(--clay);\">1<\u002Fspan>\n      <span style=\"font-size: var(--t-sub); font-weight: 600;\">Annual deductible<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.4;\">Up to a $615 maximum, up from $590 in 2025. Many plans offer a lower deductible or none at all.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: var(--panel); border-radius: 22px; padding: 40px 38px; display: flex; flex-direction: column; gap: 18px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 56px; font-weight: 600; line-height: 1; color: var(--honey);\">2<\u002Fspan>\n      <span style=\"font-size: var(--t-sub); font-weight: 600;\">Initial coverage<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.4;\">Once the deductible is met, you pay your plan's copay or coinsurance.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: var(--panel); border-radius: 22px; padding: 40px 38px; display: flex; flex-direction: column; gap: 18px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 56px; font-weight: 600; line-height: 1; color: var(--sage);\">3<\u002Fspan>\n      <span style=\"font-size: var(--t-sub); font-weight: 600;\">Catastrophic coverage<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.4;\">Once your out-of-pocket costs reach $2,100, up from $2,000 in 2025, you pay $0 for the rest of the year.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"2026 Changes\" data-screen-label=\"17\" data-speaker-notes=\"Four changes worth knowing. The payment plan is voluntary — they have to ask for it.\" style=\"padding: var(--pad-top) var(--pad-x) var(--pad-bottom); background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">What's New<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Medicare Changes for 2026<\u002Fh2>\n  <div style=\"margin-top: var(--gap-title); display: grid; grid-template-columns: 1fr 1fr; gap: 44px 64px; flex: 1;\">\n    <div style=\"border-top: 3px solid var(--rule); padding-top: 28px; display: flex; flex-direction: column; gap: 14px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: var(--t-sub); font-weight: 600; color: var(--clay);\">Drug cost cap<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.4;\">A $2,100 annual cap on Part D out-of-pocket drug costs.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top: 3px solid var(--rule); padding-top: 28px; display: flex; flex-direction: column; gap: 14px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: var(--t-sub); font-weight: 600; color: var(--blue);\">Negotiated drug prices<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.4;\">CMS-negotiated prices begin for the first 10 high-cost Part D drugs.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top: 3px solid var(--rule); padding-top: 28px; display: flex; flex-direction: column; gap: 14px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: var(--t-sub); font-weight: 600; color: var(--sage);\">Prescription Payment Plan<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.4;\">Every Part D plan must offer the voluntary Medicare Prescription Payment Plan, spreading costs across the year.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top: 3px solid var(--rule); padding-top: 28px; display: flex; flex-direction: column; gap: 14px;\">\n      <span style=\"font-family: 'Bitter', serif; font-size: var(--t-sub); font-weight: 600; color: var(--plum);\">Preventive vaccines at $0<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.4;\">All recommended adult vaccines, including shingles and Tdap, remain at $0 cost-share.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Enrollment Periods\" data-screen-label=\"18\" data-speaker-notes=\"Circle October 15 through December 7. Most decisions get made in that window.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">The Calendar<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Enrollment Periods<\u002Fh2>\n  <div style=\"margin-top: 32px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end;\">\n    <span style=\"grid-column: 1 / span 3; height: 46px; border-radius: 12px 12px 0 0; background: var(--blue);\"><\u002Fspan>\n    <span style=\"grid-column: 4 / span 6;\"><\u002Fspan>\n    <span style=\"grid-column: 10 / span 3; height: 46px; border-radius: 12px 12px 0 0; background: var(--clay);\"><\u002Fspan>\n    <span style=\"grid-column: 1 / span 1; font-size: 26px; font-weight: 700; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Jan<\u002Fspan>\n    <span style=\"font-size: 26px; font-weight: 700; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Feb<\u002Fspan>\n    <span style=\"font-size: 26px; font-weight: 700; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Mar<\u002Fspan>\n    <span style=\"font-size: 26px; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Apr<\u002Fspan>\n    <span style=\"font-size: 26px; text-align: center; padding-top: 12px; color: var(--ink-soft);\">May<\u002Fspan>\n    <span style=\"font-size: 26px; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Jun<\u002Fspan>\n    <span style=\"font-size: 26px; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Jul<\u002Fspan>\n    <span style=\"font-size: 26px; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Aug<\u002Fspan>\n    <span style=\"font-size: 26px; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Sep<\u002Fspan>\n    <span style=\"font-size: 26px; font-weight: 700; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Oct<\u002Fspan>\n    <span style=\"font-size: 26px; font-weight: 700; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Nov<\u002Fspan>\n    <span style=\"font-size: 26px; font-weight: 700; text-align: center; padding-top: 12px; color: var(--ink-soft);\">Dec<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; flex: 1;\">\n    <div style=\"background: oklch(0.94 0.04 30); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column;\">\n      <div style=\"background: var(--clay); padding: 20px 32px; display: flex; flex-direction: column; gap: 4px;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 40px; font-weight: 700; color: oklch(0.98 0.01 40);\">Oct 15 – Dec 7<\u002Fspan>\n        <span style=\"font-size: var(--t-small); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: oklch(0.92 0.03 40);\">Annual Enrollment<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"flex: 1; padding: 26px 32px; font-size: var(--t-body); line-height: 1.3;\">Change your Part D plan, or switch between Original Medicare and Advantage. Coverage starts January 1.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 250); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column;\">\n      <div style=\"background: var(--blue); padding: 20px 32px; display: flex; flex-direction: column; gap: 4px;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 40px; font-weight: 700; color: oklch(0.98 0.01 250);\">Jan 1 – Mar 31<\u002Fspan>\n        <span style=\"font-size: var(--t-small); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: oklch(0.90 0.03 250);\">Open / General Enrollment<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"flex: 1; padding: 26px 32px; font-size: var(--t-body); line-height: 1.3;\">One Advantage plan switch, or a return to Original Medicare. Also the window to sign up for a missed Part A or B.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: oklch(0.945 0.03 152); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column;\">\n      <div style=\"background: var(--sage); padding: 20px 32px; display: flex; flex-direction: column; gap: 4px;\">\n        <span style=\"font-family: 'Bitter', serif; font-size: 40px; font-weight: 700; color: oklch(0.98 0.01 152);\">Dates vary<\u002Fspan>\n        <span style=\"font-size: var(--t-small); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: oklch(0.92 0.03 152);\">Special Enrollment<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"flex: 1; padding: 26px 32px; font-size: var(--t-body); line-height: 1.3;\">Triggered by a qualifying life event: losing employer coverage, moving, or becoming eligible for Medicaid.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin: 24px 0 0; font-size: var(--t-legal); line-height: 1.35; color: var(--ink-soft);\">We do not offer every plan available in your area. Any information we provide is limited to those plans we do offer in your area. Please contact Medicare.gov or 1-800-MEDICARE to get information on all of your options. For accommodations of persons with special needs at meetings, call 1-800-MEDICARE (TTY: 711). Not affiliated with or endorsed by the U.S. government or the federal Medicare program.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Assistance &amp; Savings\" data-screen-label=\"19\" data-speaker-notes=\"Many people qualify for Extra Help and never apply. Offer to check eligibility one-on-one.\" style=\"padding: 72px var(--pad-x) 60px; background: var(--bg); color: var(--ink); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--blue);\">Lowering Your Costs<\u002Fspan>\n  <h2 style=\"margin: 14px 0 0; font-family: 'Bitter', serif; font-size: var(--t-title); font-weight: 600; letter-spacing: -1px;\">Financial Assistance &amp; How to Save<\u002Fh2>\n  <div style=\"margin-top: 32px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px;\">\n    <div style=\"background: var(--clay); border-radius: 22px; padding: 26px 30px; display: flex; flex-direction: column; gap: 12px; color: oklch(0.98 0.01 40);\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 42px; font-weight: 700; line-height: 1.05;\">Extra Help<\u002Fspan>\n      <span style=\"font-size: var(--t-small); line-height: 1.3; color: oklch(0.93 0.03 40);\">Drug cost help for limited income and resources<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: var(--blue); border-radius: 22px; padding: 26px 30px; display: flex; flex-direction: column; gap: 12px; color: oklch(0.98 0.01 250);\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 42px; font-weight: 700; line-height: 1.05;\">Medicaid<\u002Fspan>\n      <span style=\"font-size: var(--t-small); line-height: 1.3; color: oklch(0.91 0.03 250);\">State coverage that can work alongside Medicare<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: var(--sage); border-radius: 22px; padding: 26px 30px; display: flex; flex-direction: column; gap: 12px; color: oklch(0.98 0.01 152);\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 42px; font-weight: 700; line-height: 1.05;\">Savings Programs<\u002Fspan>\n      <span style=\"font-size: var(--t-small); line-height: 1.3; color: oklch(0.93 0.03 152);\">Help with Part A and B premiums and deductibles<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background: var(--plum); border-radius: 22px; padding: 26px 30px; display: flex; flex-direction: column; gap: 12px; color: oklch(0.98 0.01 348);\">\n      <span style=\"font-family: 'Bitter', serif; font-size: 42px; font-weight: 700; line-height: 1.05;\">PACE<\u002Fspan>\n      <span style=\"font-size: var(--t-small); line-height: 1.3; color: oklch(0.93 0.03 348);\">All-inclusive care for the elderly<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top: 30px; flex: 1; background: var(--panel); border-radius: 26px; padding: 34px 44px; display: flex; flex-direction: column; justify-content: center; gap: 24px;\">\n    <span style=\"font-size: var(--t-small); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft);\">Six ways to save<\u002Fspan>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 22px 60px;\">\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">Use your free preventive services<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">Use a preferred or mail-order pharmacy<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">Stay in network<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">Know if you are admitted or under observation<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">Ask your doctor about generics<\u002Fspan>\n      <span style=\"font-size: var(--t-body); line-height: 1.3;\">Check eligibility for Extra Help and Savings Programs<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Contact\" data-screen-label=\"20\" data-speaker-notes=\"Invite questions. Offer to schedule one-on-one reviews before AEP closes.\" style=\"padding: var(--pad-top) var(--pad-x) var(--pad-bottom); background: var(--dark); color: oklch(0.97 0.01 85); font-family: 'Source Sans 3', sans-serif; display: flex; flex-direction: column; justify-content: center;\">\n  <span style=\"font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: oklch(0.78 0.09 78);\">Questions &amp; Answers<\u002Fspan>\n  <h2 style=\"margin: 24px 0 0; font-family: 'Bitter', serif; font-size: 88px; font-weight: 600; letter-spacing: -1.5px; line-height: 1.1;\">Let's find the plan that fits you.<\u002Fh2>\n  <div style=\"margin-top: 72px; display: flex; flex-direction: column; gap: 20px;\">\n    <span style=\"font-family: 'Bitter', serif; font-size: 52px; font-weight: 600;\">Thomas Crowhurst<\u002Fspan>\n    <span style=\"font-size: var(--t-body); color: oklch(0.84 0.02 85);\">Licensed Insurance Broker<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"margin-top: 56px; display: flex; gap: 72px; align-items: baseline; font-size: var(--t-sub);\">\n    <span style=\"font-weight: 600;\">317-728-9417<\u002Fspan>\n    <span style=\"font-weight: 600;\">thomas@crowhurstinsurance.com<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin: 64px 0 0; font-size: var(--t-body); font-style: italic; color: oklch(0.82 0.03 85);\">Helping you secure a healthier future.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
